#@TYPE: Machine
#@NAME: Auvidea X230D AGX Orin 64GB
##@DESCRIPTION: Auvidea X230D carrier board with Jetson AGX Orin 64GB module
#

MACHINEOVERRIDES = "p3737-0000-p3701-0005:${MACHINE}"
include conf/machine/p3737-0000-p3701-0005.conf

# work-around for https://github.com/OE4T/meta-tegra/issues/400
MACHINEOVERRIDES := "${@'${MACHINEOVERRIDES}'.replace(':${MACHINE}',':p3737-0000-p3701-0005:${MACHINE}')}"

# Use Auvidea X230D carrier board specific device tree
KERNEL_DEVICETREE = "tegra234-auvidea-X230+p3701-0005-nv.dtb"

# Auvidea X230D uPHY layout — overrides the NVIDIA devkit value from agx-orin.inc
# (gbe-uphy-config-22 + gbe0-enable-10g is devkit-specific and breaks GbE on Auvidea)
ODMDATA = "gbe-uphy-config-0,hsstp-lane-map-3,nvhs-uphy-config-0,hsio-uphy-config-16"
